name: Development Pipeline

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'

jobs:
  test-and-build:
    name: Test and Build
    runs-on: macos-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Use NodeJS v20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20.x

      - name: Install Dependencies
        run: npm install -g yarn && yarn install

      - name: Runt Lint
        run: yarn lint

      # - name: Run Unit Tests
      #   run: yarn test

      - name: Run Build
        run: yarn build
